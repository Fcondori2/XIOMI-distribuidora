[project]
name = "xiomi-distribuidora"
version = "1.0.0"
description = "Sistema de gestión comercial Xiomi Distribuidora"
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.4",
    "fpdf2",
]

[tool.flet]
product = "XIOMI Distribuidora"
org = "com.flet"

[tool.flet.app]
module = "app.py"

[tool.flet.compile]
app = false

[tool.flet.boot_screen.flet]
theme_mode = "light"
spinner_size = 32
startup_message = "Preparando XIOMI Distribuidora..."
